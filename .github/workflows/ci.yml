name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TEST_DATABASE_URL: postgres://webhook:webhook_test@localhost:5432/webhook_test?sslmode=disable
      DATABASE_URL: postgres://webhook:webhook_test@localhost:5432/webhook_test?sslmode=disable

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: webhook_test
          POSTGRES_USER: webhook
          POSTGRES_PASSWORD: webhook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webhook -d webhook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run database migrations
        run: go run . migrate

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run static analysis
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...

  resilience:
    name: Resilience smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run RabbitMQ recovery smoke test
        shell: pwsh
        run: ./scripts/resilience-smoke.ps1 -RecoveryWaitSeconds 20

      - name: Run PostgreSQL recovery smoke test
        shell: pwsh
        run: ./scripts/postgres-resilience-smoke.ps1 -RecoveryWaitSeconds 20

      - name: Tear down resilience environment
        if: always()
        run: docker compose down --volumes --remove-orphans
