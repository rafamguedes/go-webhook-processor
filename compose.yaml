services:
  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    container_name: go-webhook-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-webhook}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-webhook_dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  webhook-processor:
    build:
      context: .
      dockerfile: Dockerfile
    image: go-webhook-processor:local
    container_name: go-webhook-processor
    environment:
      PORT: ${PORT:-8080}
      QUEUE_SIZE: ${QUEUE_SIZE:-100}
      WORKER_COUNT: ${WORKER_COUNT:-3}
      READ_HEADER_TIMEOUT_SECONDS: ${READ_HEADER_TIMEOUT_SECONDS:-5}
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-10}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      RETRY_BACKOFF_SECONDS: ${RETRY_BACKOFF_SECONDS:-1}
      DEAD_LETTER_CAPACITY: ${DEAD_LETTER_CAPACITY:-100}
      DATABASE_PATH: /data/events.db
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-webhook}:${RABBITMQ_PASSWORD:-webhook_dev}@rabbitmq:5672/
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-webhook.events}
      RABBITMQ_RECONNECT_MS: ${RABBITMQ_RECONNECT_MS:-1000}
      RABBITMQ_CONNECT_TIMEOUT_MS: ${RABBITMQ_CONNECT_TIMEOUT_MS:-5000}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-500}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      PROCESSING_LEASE_SECONDS: ${PROCESSING_LEASE_SECONDS:-300}
      PROCESSING_REQUEUE_DELAY_MS: ${PROCESSING_REQUEUE_DELAY_MS:-1000}
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./data:/data
    restart: unless-stopped

volumes:
  rabbitmq-data:
