global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: webhook-processor
    metrics_path: /metrics/prometheus
    dns_sd_configs:
      - names:
          - webhook-processor
        type: A
        port: 8080
