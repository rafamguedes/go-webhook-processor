global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: webhook-processor
    metrics_path: /metrics/prometheus
    static_configs:
      - targets:
          - webhook-processor:8080
